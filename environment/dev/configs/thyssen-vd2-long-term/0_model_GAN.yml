# CAS specific
env: dev
tag: 0b3426b3-94af-4b8c-89c1-da57493c099a


# model configuration
model:
  class_path: CompriskV2.model.gan.GAN
  init_args:
    loss: BCEWithLogitsLoss
    optimizer: Adam
    weight_init: Xavier_uniform
    disc_output_linear_hidden_dim: 128
    lr: 0.0001
    gen_lr: 1e-5
    disc_lr: 1e-5
    gen_lr_decay: 1
    disc_lr_decay: 1
    gradient_clipping_val: 1.0
    num_class_steps: 1
    autoencoder_dropout_rate: 0.
    label_smoothing: 0.

seed_everything: 42
trainer:
  #fast_dev_run: True
  accelerator: gpu
  callbacks:
    #- class_path: lightning.pytorch.callbacks.EarlyStopping
    #  init_args:
    #    monitor: val/l1
    #    min_delta: 1.0e-07
    #    patience: 10
    #    mode: min
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        save_top_k: 5
        monitor: generator_train/mse_loss
        filename: epoch={epoch:02d}-loss={generator_train/mse_loss:.5f}
        auto_insert_metric_name: false
  deterministic: True # reproduzierbarkeit für cuda
  precision: 32
  max_epochs: 125
  #gradient_clip_val: 1.0
  log_every_n_steps: 1

data:
  train: environment/dev/configs/thyssen-vd2-long-term/1_dataset_train.yml
  validate: environment/dev/configs/thyssen-vd2-long-term/2_dataset_validate.yml
  standardize: false
  sequence_in: 300
