# CAS specific
env: dev
tag: 9dc86e29-8c64-47c4-93ee-7b83c896b7ee

# model configuration
model:
  class_path: CompriskV2.model.ko3.SupportPointModel
  init_args:
    kernel: linear
    ko3_table: environment/dev/support_points/gasunie

# trainer and dataset config
seed_everything: 0
trainer:
  accelerator: mps
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        min_delta: 1.0e-07
        patience: 10
        mode: min
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        save_top_k: 10
        monitor: val/loss
        filename: epoch={epoch:02d}-loss={val/loss:.5f}
        auto_insert_metric_name: false

  precision: 32
  max_epochs: 4
  gradient_clip_val: 1.0
  log_every_n_steps: 1

data:
  train: environment/dev/configs/gasunie-sp/1_dataset_train.yml
  validate: environment/dev/configs/gasunie-sp/2_dataset_validate.yml
  sequence_in: 1
  sequence_out: 0
  features_in:
    - 4174ecf6-af4b-44f3-bd2c-d3a7a2c68ece # Suction pressure
    - a7df6efc-91f1-423c-9896-69e7ef27692f # Discharge pressure
    - b494f0c0-4446-4626-9eed-b8a8bba4f65d # Speed
    - 3f9cf382-2e66-4805-9f44-8afe4ad6ba29 # Suction temperature
    - 5be01343-45c0-40af-a93f-9368aff5e73d # Downstream temperature
    - 2289399d-93ef-4352-88a9-4031c7d7798a # DA_Double_Acting (-)
  features_out:
    - d67bd4d9-7568-4452-a81c-84029a2f10b9 # Discharge pressure Stage 1
    - 7a84feb3-e6a0-4c3f-ac37-5269f6ca5390 # Discharge temperature Stage 1
    - 75247d9f-29e8-4140-8a3a-aa04d55483e5 # Discharge temperature Stage 2
  skip: 1
  stride: 1
  batch_size: 512
  shuffle: true
  num_workers: 8
  behavior: autoencoder
