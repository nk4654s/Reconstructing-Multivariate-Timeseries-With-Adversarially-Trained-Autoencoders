seed_everything: true
trainer:
  callbacks: 
    # define the early stopping callback
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: validate/MSELoss
        min_delta: 0.00001
        patience: 3
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        every_n_epochs: 1
        monitor: validate/MSELoss
        filename: "epoch={epoch}-val={validate/MSELoss:.6f}"
        auto_insert_metric_name: false
        save_top_k: 12
        mode: min
        dirpath: checkpoints
        
  # define training configuration
  precision: 32
  max_epochs: 10
  gradient_clip_val: 1.0
#  profiler: "simple"
  log_every_n_steps: 1
# configure model hyper-parameter
model:
  class_path: Comprisk.model.ae.rnn.EncDecAD
  init_args:
    # gerneral parameters
    activation: tanh
    loss: MSELoss
    optimizer: Adam
    lr: 0.001
    lr_decay: 0.9
    # encoder/decoder
    encoder:
      class_path: Comprisk.model.ae.rnn.EDAEncoder
      init_args:
        num_features: 22
        num_hidden_dim: 48
        num_hidden_layers: 3
        dropout_prob: 0.4
    decoder:
      class_path: Comprisk.model.ae.rnn.EDADecoder
      init_args:
        num_features: 22
        num_hidden_dim: 48
        num_hidden_layers: 3
        dropout_prob: 0.4
data:
  # configure dataset to load
  train: /Users/jonas/Dev/NEAX/Comprisk/thyssen-vd2-trainset-II
  validate: /Users/jonas/Dev/NEAX/Comprisk/thyssen-vd2-valset-II
  sequence_in: 60
  sequence_out: 60
  skip: 1
  stride: 10
  batch_size: 128
  shuffle: true
  num_workers: 8