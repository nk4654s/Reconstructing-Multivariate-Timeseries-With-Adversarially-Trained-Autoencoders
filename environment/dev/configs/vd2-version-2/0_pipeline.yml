environment: dev

# 1. define the dataset to use
dataset:
 - config: configs/vd2-version-2/1_dataset_train.yml
 - config: configs/vd2-version-2/2_dataset_validate.yml
 - config: configs/vd2-version-2/4_testset_coolant_flow.yml
 - config: configs/vd2-version-2/5_testset_service.yml
 - config: configs/vd2-version-2/6_testset_coolant_pressure.yml
 - config: configs/vd2-version-2/7_testset_plc_alarm.yml
# do not download the configuration file, but copy it to the model's output folder
 - config: configs/vd2-version-2/8_dataset_upload.yml
   copy_to_output: upload.yaml

# 2. train the model using the tuned hyperparameters
trainer:
  # load a trained model using "--load" environment/dev/models/EncDecAD/0b3426b3-94af-4b8c-89c1-da57493c099a/version_0/config.yaml
  - config: configs/vd2-version-2/3_model.yml
    tag: 0b3426b3-94af-4b8c-89c1-da57493c099a

    # overwrite the config's values
    # for path values, the explicit path is required
    data.train: environment/dev/datasets/thyssen-vd2-trainset-phase-2
    data.validate: environment/dev/datasets/thyssen-vd2-valset-phase-2

score_trainer:
  score.mode: linear
  data.validate: environment/dev/datasets/thyssen-vd2-valset-phase-2
  data.stride: 60

analyzer:
# 1. generate data on the test dataset
  - dataset: datasets/thyssen-vd2-test-service
    prefix: analysis/service
    data.stride: 60
# 2. generate data on the train dataset
  - dataset: datasets/thyssen-vd2-valset-phase-2
    prefix: analysis/validate
    data.stride: 60
# 3. generate data on the last test dataset which includes the timespan where someone limited the coolant flow
  - dataset: datasets/thyssen-vd2-test-coolant
    prefix: analysis/coolant
    data.stride: 60
  - dataset: datasets/thyssen-vd2-test-coolant-pressure
    prefix: analysis/coolant-pressure
    data.stride: 60
  - dataset: datasets/thyssen-vd2-test-plc-alarm
    prefix: analysis/coolant-pressure
    data.stride: 60
