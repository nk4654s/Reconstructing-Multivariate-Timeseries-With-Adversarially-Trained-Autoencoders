# CAS specific
environment: dev
tag: a6252582-01dd-49cb-8dbe-0742b28bc007
name_mapping: environment/dev/configs/thyssen/1_mapping.yml
support_points: environment/dev/support_points/thyssen_gas/

# model configuration
model:
  class_path: Compmesh.model.support_point.SupportPointModel
  init_args:
    activation: linear
    loss: MSELoss
    optimizer: Adam
    lr: 0.001
    lr_decay: 0.9

# trainer and dataset config
seed_everything: 0
trainer:
  accelerator: mps
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: validate/MSELoss
        min_delta: 1.0e-05
        patience: 3
    - class_path: Comprisk.helper.checkpoint.BasicCheckpointCallback

  precision: 32
  max_epochs: 3
  gradient_clip_val: 1.0
  log_every_n_steps: 1

data:
  train: configs/vd1-version-1/1_dataset_train.yml
  validate: configs/vd1-version-1/2_dataset_validate.yml
  sequence_in: 1
  sequence_out: 0
  features_in:
    - 40266713-aba1-42f3-a8ce-ed76e9072034
    - 0fde253b-8465-40f8-84ac-4f385096d467
    - c3f86569-e2fc-494a-9700-d03ce4bc11d2
    - 023a0e7a-849e-4acd-ad7f-c011be125745
    - c5991d25-d729-4a9f-93f0-cebe60de6672
  features_out:
    - 369afc93-5604-45a1-92ff-ae9915ba9cf4
    - 6d6f8beb-4e55-4b00-913c-5e87a1a8078d
    - 9cf511a4-7a9a-488f-b642-4a946f27c808
    - 0269fbad-b2db-4677-9fc0-2814a0bf193b
    - 5630cba4-cc34-4b94-b6a7-0b55f250ffca
  skip: 1
  stride: 1
  batch_size: 256
  shuffle: true
  num_workers: 8
  behavior: autoencoder