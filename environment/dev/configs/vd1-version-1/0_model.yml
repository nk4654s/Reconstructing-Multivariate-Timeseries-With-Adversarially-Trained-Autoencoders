# CAS specific
environment: dev
tag: a6252582-01dd-49cb-8dbe-0742b28bc007
normalizer: configs/vd1-version-1/3_custom_normalizer.yml

# model configuration
model:
  class_path: Comprisk.model.auto_encoder.rnn.MultimodalRecurrentAutoEncoder
  init_args:
    activation: tanh
    loss: MSELoss
    optimizer:
      name: AdamW
      weight_decay: 0.01
    lr: 0.0001
    lr_decay: 0.9
    num_hidden_dim: 64
    num_hidden_layers: 3
    dropout_prob: 0.3

# trainer and dataset config
seed_everything: 0
trainer:
  accelerator: mps
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: validate/MSELoss
        min_delta: 1.0e-05
        patience: 3
    - class_path: Comprisk.helper.checkpoint.BasicCheckpointCallback

  precision: 32
  max_epochs: 7
  gradient_clip_val: 1.0
  log_every_n_steps: 1

data:
  train: configs/vd1-version-1/1_dataset_train.yml
  validate: configs/vd1-version-1/2_dataset_validate.yml
  sequence_in: 120
  sequence_out: 1
