# CAS specific
environment: dev
tag: 0b3426b3-94af-4b8c-89c1-da57493c099a
upload_config: configs/vd2-version-1/3_upload.yml
score_transformer:
  mode: linear

# model configuration
model:
  class_path: Comprisk.model.auto_encoder.rnn.MultimodalRecurrentAutoEncoder
  init_args:
    activation: tanh
    loss: MSELoss
    optimizer: Adam
    lr: 0.0001
    lr_decay: 0.9
    num_hidden_dim: 64
    num_hidden_layers: 4
    dropout_prob: 0.3

# trainer and dataset config
seed_everything: true
trainer:
  accelerator: mps
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: validate/MSELoss
        min_delta: 0.000001
        patience: 4
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        every_n_epochs: 1
        monitor: validate/MSELoss
        filename: "epoch={epoch}-val={validate/MSELoss:.6f}"
        auto_insert_metric_name: false
        save_top_k: 3
        mode: min
        dirpath: checkpoints

  precision: 32
  max_epochs: 5
  gradient_clip_val: 1.0
  log_every_n_steps: 1

data:
  train: configs/vd2-version-1/1_dataset_train.yml
  validate: configs/vd2-version-1/2_dataset_validate.yml
  sequence_in: 60
  sequence_out: 0
  features_in:
    - Biomethandurchfluss (m^3/min)
    - DifferenzdruckTriebwerksölPDIT74553 (bar)
    - EndtemperaturZweiteStufenachKühlerTETIT74378 (°C)
    - EnddruckZweiteStufePIT74397 (bar)
    - EndtemperaturZweiteStufeTETIT74371 (°C)
