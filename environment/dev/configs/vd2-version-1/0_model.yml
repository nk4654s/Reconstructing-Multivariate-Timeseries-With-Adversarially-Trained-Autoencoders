    - KühlwasserdrucknachPumpePIT74425 (bar)
    - Motorlager (°C)
    - ÖltemperaturVorlaufTriebwerkTETIT74538 (°C)
    - PackungsleckageFIT74389 (Nm3h)
    - SaugdruckZweiteStufePIT74340 (bar)
