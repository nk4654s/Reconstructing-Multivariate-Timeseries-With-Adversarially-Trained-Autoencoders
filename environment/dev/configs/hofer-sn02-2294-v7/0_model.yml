tag: 52381507-e89c-473a-84ef-8e4810c4aa68
normalizer: configs/hofer-sn02-2294-v7/3_custom_normalizer.yml

# model configuration
model:
  class_path: Comprisk.model.auto_encoder.rnn.MultimodalRecurrentAutoEncoder
  init_args:
    activation: tanh
    loss: MSELoss
    optimizer: Adam
    lr: 0.0001
    lr_decay: 0.9
    num_hidden_dim: 64
    num_hidden_layers: 3
    dropout_prob: 0.3

seed_everything: true
trainer:
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: validate/MSELoss
        min_delta: 1.0e-05
        patience: 3
    - class_path: Comprisk.helper.checkpoint.BasicCheckpointCallback

  precision: 32
  max_epochs: 25
  gradient_clip_val: 1.0
  log_every_n_steps: 1

