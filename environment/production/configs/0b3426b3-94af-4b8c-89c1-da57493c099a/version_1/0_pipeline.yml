environment: production

# 1. define the dataset to use
dataset:
 - config: configs/0b3426b3-94af-4b8c-89c1-da57493c099a/version_1/1_dataset_train.yml
 - config: configs/0b3426b3-94af-4b8c-89c1-da57493c099a/version_1/2_dataset_validate.yml
# do not download the configuration file, but copy it to the model's output folder
 - config: configs/0b3426b3-94af-4b8c-89c1-da57493c099a/version_1/8_dataset_upload.yml
   copy_to_output: upload.yaml

# 2. train the model using the tuned hyperparameters
trainer:
  # load a trained model using "--load" environment/production/models/0b3426b3-94af-4b8c-89c1-da57493c099a/version_0/config.yaml
  - config: configs/0b3426b3-94af-4b8c-89c1-da57493c099a/version_1/3_model.yml
    tag: 0b3426b3-94af-4b8c-89c1-da57493c099a

    # overwrite the config's values
    # for path values, the explicit path is required
    data.train: environment/production/datasets/thyssen-vd2-trainset-phase-2
    data.validate: environment/production/datasets/thyssen-vd2-valset-phase-2

score_trainer:
  score.mode: linear
  data.validate: environment/production/datasets/thyssen-vd2-valset-phase-2
  data.stride: 60
