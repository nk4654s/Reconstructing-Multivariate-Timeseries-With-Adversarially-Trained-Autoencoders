environment: production

dataset:
 - config: configs/0b3426b3-94af-4b8c-89c1-da57493c099a/version_0/1_dataset_train.yml
 - config: configs/0b3426b3-94af-4b8c-89c1-da57493c099a/version_0/2_dataset_validate.yml

# do not download the configuration file, but copy it to the model's output folder
 - config: configs/0b3426b3-94af-4b8c-89c1-da57493c099a/version_0/4_dataset_upload.yml
   copy_to_output: upload.yaml

trainer:
  - config: configs/0b3426b3-94af-4b8c-89c1-da57493c099a/version_0/3_model.yml
    tag: 0b3426b3-94af-4b8c-89c1-da57493c099a

    # overwrite the config's values
    # for path values, the explicit path is required
    data.train: environment/production/datasets/thyssen-vd2-trainset-phase-1
    data.validate: environment/production/datasets/thyssen-vd2-valset-phase-1

    data.sequence_in: 60
    data.sequence_out: 0 # reduces RAM usage during training
    data.stride: 1
    data.batch_size: 256

    trainer.max_epochs: 3

score_trainer:
  score.mode: linear
  data.validate: environment/production/datasets/thyssen-vd2-valset-phase-1
  data.stride: 60

analyzer:
  - dataset: datasets/thyssen-vd2-valset-phase-1
    prefix: analysis/validate
    data.stride: 60
