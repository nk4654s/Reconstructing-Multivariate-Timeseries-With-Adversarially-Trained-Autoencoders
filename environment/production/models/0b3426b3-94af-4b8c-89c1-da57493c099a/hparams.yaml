_class_path: Comprisk.model.ae.rnn.EncDecAD
_instantiator: lightning.pytorch.cli.instantiate_module
activation: tanh
decoder:
  class_path: Comprisk.model.ae.rnn.EDADecoder
  init_args:
    dropout_prob: 0.4
    num_features: 22
    num_hidden_dim: 64
    num_hidden_layers: 3
encoder:
  class_path: Comprisk.model.ae.rnn.EDAEncoder
  init_args:
    dropout_prob: 0.4
    num_features: 22
    num_hidden_dim: 64
    num_hidden_layers: 3
loss: MSELoss
lr: 0.0001
lr_decay: 0.9
optimizer: Adam
