# 0. define the dataset to use
dataset:
 - config: configs/vd1-version-1/dataset.yml
 - config: configs/vd1-version-1/dataset-june.yml

# 1. tune the model given a search space for the hyperparameters
# tuner:
#   config: configs/vd2-version-1/lstm_base.yml
#   tuner_config: configs/vd2-version-1/tune_search_space.yml
#   tuner_trials: 20

# 2. train the model using the tuned hyperparameters
trainer:
  - config: configs/vd1-version-1/initial_training.yml
    tag: thyssen-vd1
    step: 2
  - config: configs/vd1-version-1/final_training.yml
    tag: thyssen-vd1
    step: 2
  - config: configs/vd1-version-1/final_final_training.yml
    tag: thyssen-vd1
    step: 2

analyzer:
# 1. generate data on the train dataset
  - dataset: /Users/jonas/Dev/NEAX/Comprisk/thyssen-vd1-trainset
    prefix: analysis/transformer/train
# 2. generate data on the val dataset
  - dataset: /Users/jonas/Dev/NEAX/Comprisk/thyssen-vd1-valset
    prefix: analysis/transformer/validate

  - dataset: /Users/jonas/Dev/NEAX/Comprisk/thyssen-vd1-test-june
    prefix: analysis/transformer/test-june
#
# do not use score transformer
#
# 1. generate data on the train dataset
  - dataset: /Users/jonas/Dev/NEAX/Comprisk/thyssen-vd1-trainset
    prefix: analysis/static/train
    static_scores: true
# 2. generate data on the val dataset
  - dataset: /Users/jonas/Dev/NEAX/Comprisk/thyssen-vd1-valset
    prefix: analysis/validate
    static_scores: true

  - dataset: /Users/jonas/Dev/NEAX/Comprisk/thyssen-vd1-test-june
    prefix: analysis/static/test-june
    static_scores: true

  