# 1. define the dataset to use
dataset:
 - config: configs/vd2-version-1/dataset.yml
 - config: configs/vd2-version-1/dataset-validate.yml
 - config: configs/vd2-version-1/testset-service.yml
 - config: configs/vd2-version-1/testset-coolant-anomaly.yml

# 2. train the model using the tuned hyperparameters
trainer:
  - config: configs/vd2-version-1/initial_training_encdec.yml
    tag: thyssen-vd2-training

    # overwrite the config's values
    data.train: /Users/jonas/Dev/NEAX/Comprisk/thyssen-vd2-trainset
    data.validate: /Users/jonas/Dev/NEAX/Comprisk/thyssen-vd2-valset
    data.stride: 1
    data.sequence_in: 120
    data.sequence_out: 120
  
score_trainer:
  score.method: linear
  data.stride: 120

analyzer:
# 1. generate data on the test dataset
  - dataset: /Users/jonas/Dev/NEAX/Comprisk/thyssen-vd2-service
    prefix: analysis/service
# 2. generate data on the train dataset
  - dataset: /Users/jonas/Dev/NEAX/Comprisk/thyssen-vd2-valset
    prefix: analysis/validate
# 3. generate data on the last test dataset which includes the timespan where someone limited the coolant flow
  - dataset: /Users/jonas/Dev/NEAX/Comprisk/thyssen-vd2-coolant-anomaly
    prefix: analysis/coolant
