# 0. define the dataset to use
dataset:
 - config: /Users/jonas/Dev/NEAX/Comprisk/configs/gasunie-version-1/dataset.yml

# 1. tune the model given a search space for the hyperparameters
# tuner:
#   config: configs/vd2-version-1/lstm_base.yml
#   tuner_config: configs/vd2-version-1/tune_search_space.yml
#   tuner_trials: 20

# 2. train the model using the tuned hyperparameters
trainer:
  - config: /Users/jonas/Dev/NEAX/Comprisk/configs/gasunie-version-1/initial_training.yml
    tag: gasunie-v1
    step: 2
  - config: /Users/jonas/Dev/NEAX/Comprisk/configs/gasunie-version-1/final_training.yml
    tag: gasunie-v1
    step: 2
  - config: /Users/jonas/Dev/NEAX/Comprisk/configs/gasunie-version-1/final_final_training.yml
    tag: gasunie-v1
    step: 2

analyzer:
# 1. generate data on the train dataset
  - dataset: /Users/jonas/Dev/Prod/gasunie-trainset
    prefix: analysis/transformer/train
# 2. generate data on the val dataset
  - dataset: /Users/jonas/Dev/Prod/gasunie-valset
    prefix: analysis/transformer/validate
#
# do not use score transformer
#
# 1. generate data on the train dataset
  - dataset: /Users/jonas/Dev/Prod/gasunie-trainset
    prefix: analysis/static/train
    static_scores: true
# 2. generate data on the val dataset
  - dataset: /Users/jonas/Dev/Prod/gasunie-valset
    prefix: analysis/static/validate
    static_scores: true
  