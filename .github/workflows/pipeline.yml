name: CAS CI/CD

on:
  push:
    paths:
      - 'environment/production/models/**'
    branches:
      - master
  workflow_dispatch:

jobs:
  dataflux-test:
    uses: ./.github/workflows/dataflux-tests.yml

  comprisk-test:
    uses: ./.github/workflows/comprisk-tests.yml

  toking-test:
    uses: ./.github/workflows/toking-tests.yml

  docker-build:
    uses: ./.github/workflows/docker-build.yml
    needs:
      - dataflux-test
      - comprisk-test
      - toking-test
    secrets: inherit
    with:
      ECR_REPOSITORY: 'xplore-ai-cas'
      CONTAINER_LOCAL_PATH: './dockerfiles'