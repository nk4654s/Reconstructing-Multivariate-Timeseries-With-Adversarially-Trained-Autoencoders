name: CAS CI/CD

permissions:
  contents: read
  actions: read
  checks: write
  packages: write
  
on:
  push:
    paths:
      - 'environment/production/models/**'
    branches:
      - master
  workflow_dispatch:

jobs:
  dataflux-test:
    uses: ./.github/workflows/dataflux-tests.yml

  comprisk-test:
    uses: ./.github/workflows/comprisk-tests.yml

  toking-test:
    uses: ./.github/workflows/toking-tests.yml

  build-jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build Jar
        run: |
          uv run dev_tools.py

      - name: Set up Java and Maven
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Deploy to GitHub Packages
        run: mvn deploy -X
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

