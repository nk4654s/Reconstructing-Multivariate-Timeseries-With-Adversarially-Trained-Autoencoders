name: CAS CI/CD

on:
  push:
    paths:
      - 'environment/production/models/**'
    branches:
      - master
  workflow_dispatch:

jobs:
  dataflux-test:
    uses: ./.github/workflows/dataflux-tests.yml

  comprisk-test:
    uses: ./.github/workflows/comprisk-tests.yml

  toking-test:
    uses: ./.github/workflows/toking-tests.yml

  build-jar:
    runs-on: ubuntu-latest
    steps:
      # Run unit tests
      - name: Build Jar
        working-directory: .
        run: |
          python dev_tools.py -b

      - name: Upload JAR to GitHub Packages
        run: |
          curl -X PUT \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @model.jar \
            "https://maven.pkg.github.com/neaxplore/xplore-ai-cas/model-package.jar"

      - name: Upload JAR to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: model.jar

