name: CAS CI/CD

on:
  push:
    paths:
      - 'environment/production/models/**'
    branches:
      - master
  workflow_dispatch:

jobs:
  dataflux-test:
    uses: ./.github/workflows/dataflux-tests.yml

  comprisk-test:
    uses: ./.github/workflows/comprisk-tests.yml

  toking-test:
    uses: ./.github/workflows/toking-tests.yml

  build-jar:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.12

      - name: Build Jar
        run: |
          python ./dev_tools.py

      - name: Set up Java and Maven
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Deploy to GitHub Packages
        run: mvn deploy

