# This workflow will build and push a new container image to Amazon ECR, when there is a push/PR to the "master" branch.
name: CAS Build/Deploy

on:
  workflow_call:
    inputs:
      ECR_REPOSITORY:
        required: true
        type: string
      CONTAINER_LOCAL_PATH:
        required: true
        type: string

env:
  AWS_REGION: 'eu-central-1'
  DEFAULT_IMAGE_TAG: 'latest'


permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -f ${{ inputs.CONTAINER_LOCAL_PATH }}/docker.dockerfile -t $ECR_REGISTRY/${{ inputs.ECR_REPOSITORY }}:$DEFAULT_IMAGE_TAG .
        docker push $ECR_REGISTRY/${{ inputs.ECR_REPOSITORY }} --all-tags
