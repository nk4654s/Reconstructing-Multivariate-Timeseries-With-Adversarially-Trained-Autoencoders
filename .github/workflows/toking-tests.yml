name: Comprisk Tests

on:
  workflow_call:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: astral-sh/ruff-action@v3
        with:
          src: "./packages/Toking"