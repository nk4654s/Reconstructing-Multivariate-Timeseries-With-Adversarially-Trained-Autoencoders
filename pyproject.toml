[project]
name = "cas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.8"
dependencies = [
    "boto3>=1.35.95",
    "lightning>=2.5.0.post0",
    "matplotlib>=3.10.0",
    "numpy>=2.2.1",
    "optuna>=4.1.0",
    "optuna-dashboard>=0.17.0",
    "pandas>=2.2.3",
    "pdoc>=15.0.1",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "scikit-learn>=1.6.0",
    "scipy>=1.15.0",
    "setuptools>=75.8.0",
    "tensorboard==2.18.0",
    "torchinfo>=1.8.0",
    "tqdm>=4.67.1",
    "jsonargparse[signatures]>=4.35.0",
    "pyarrow>=18.1.0",
    "pip>=24.3.1",
    "ruff>=0.9.0",
    "aws-secretsmanager-caching>=1.1.3",
    "pycognito>=2024.5.1",
    "torch>=2.5.1",
    "onnx>=1.17.0",
    "ipykernel>=6.29.5",
    "onnxruntime>=1.20.1",
    "torchvision>=0.20.1",
    "torchview>=0.2.6",
    "graphviz>=0.20.3",
    "elementpath>=4.7.0",
    "markdown-pdf>=1.3.3",
    "onnxscript>=0.2.2",
    "pytest>=8.4.1",
    "notebook>=7.4.5",
]

[tool.uv.workspace]
members = ["Comprisk", "Dataflux", "Toking", "CompriskV2", "Tools"]

[project.scripts]
comprisk-analyze="Comprisk.pipeline:cli_analyze"
comprisk-score="Comprisk.pipeline:cli_train_score_transformer"
comprisk-train="Comprisk.pipeline:cli_train"
comprisk-generate="Comprisk.pipeline:cli_generate"
comprisk-tune="Comprisk.pipeline:cli_tune"

cas-train="CompriskV2.pipeline:train"
cas-export="CompriskV2.pipeline:export"
cas-visualize="CompriskV2.pipeline:visualize"
cas-tools="Tools.main:main"

flux-pipeline="Dataflux.pipeline:main"
flux-merge="Dataflux.merge:main"

toking="Toking.toking:main"

[tool.hatch.build.targets.wheel]
packages = ["packages/Comprisk", "packages/Dataflux", "packages/Toking"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
# Same as Black.
line-length = 110
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = ["E501", "UP015", "UP006", "I001", "UP035", "SIM108"]
