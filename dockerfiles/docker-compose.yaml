name: nea-cas
services:
    cas:
        environment:
            - PYTHONUNBUFFERED=1

            - CAS_DEBUG_MODE=${CAS_DEBUG_MODE}
            - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
            - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
        platform: linux/amd64
        stdin_open: true
        tty: true
        build:
            context: ..
            dockerfile: dockerfiles/Dockerfile