folder: thyssen-vd2-labeled-trainset
machine_uuid: 0b3426b3-94af-4b8c-89c1-da57493c099a
intervals:
  - 2021-10-15 2021-10-22
  - 2021-12-05 2021-12-13
  - 2022-03-19 2022-03-28
  - 2022-04-19 2022-04-27
  - 2022-08-06 2022-08-12
  - 2022-10-07 2022-10-16
  - 2023-01-01 2023-01-07
  - 2023-08-01 2023-08-14
  - 2023-08-14 2023-08-18
  - 2023-08-22 2023-08-25
  - 2023-12-17 2023-12-24
  - 2024-01-02 2024-01-06
  - 2024-01-15 2024-01-19
  - 2024-01-31 2024-02-06
  - 2024-02-09 2024-02-13
