folder: thyssen-vd1-labeled-trainset
machine_uuid: a6252582-01dd-49cb-8dbe-0742b28bc007
intervals:
  - 2023-03-21 2023-03-27
  - 2023-04-07 2023-04-13
  - 2023-05-02 2023-05-06
  - 2023-05-21 2023-05-25
  - 2023-06-09 2023-06-15
  - 2023-07-07 2023-07-12
  - 2023-07-17 2023-07-31
  - 2023-12-25 2023-12-31
  - 2024-01-06 2024-01-10
  - 2024-01-19 2024-01-31
  - 2024-02-14 2024-02-18
  - 2024-03-07 2024-03-14
  - 2024-04-07 2024-04-13
  - 2024-04-27 2024-05-02
  - 2024-06-21 2024-07-19
num_workers: 4
disk_backup: thyssen-vd1-green
overwrite: true

modules:
  - class_path: Dataflux.modules.Rename
    init_args:
      enable: True
  - class_path: Dataflux.modules.State
    init_args:
      key: "Laeuft"
      lower: 0.9
      upper: 1.1
      alpha_threshold: 10800
      beta_threshold: 900
  - class_path: Dataflux.modules.State
    init_args:
      key: "PositionBypassregelventilPCV73381 (%)"
      lower: -0.999
      upper: 0.001
      alpha_threshold: 900
      beta_threshold: 900
  - class_path: Dataflux.modules.features.Features
    init_args:
      include:
        - EnddruckErsteStufePIT73339 (bar)
        - EnddruckZweiteStufePIT73397 (bar)
        - EndtemperaturErsteStufeTETIT73334 (°C)
        - EndtemperaturZweiteStufeTETIT73371 (°C)
        - EndtemperaturZweiteStufenachKühlerTETIT73378 (°C)
        - DifferenzdruckTriebwerksölPDIT73553 (bar)
        - KompressordrehzahlSE73201 (rpm)
        - KühlwasserdrucknachPumpePIT73425 (bar)
        - KühlwasserdurchflussmengeFIT73423 (m^3/min)
        - KühlwassertemperaturnachKühlerTETIT73422 (°C)
        - Motorlager (°C)
        - PackungsleckageFIT73389 (Nm3h)
        - SaugdruckErsteStufePIT73319 (bar)
        - SaugdruckZweiteStufePIT73340 (bar)
        - SaugtemperaturErsteStufeTETIT73328 (°C)
        - SaugtemperaturZweiteStufeTETIT73341 (°C)
        - SchwingungsmessungTriebwerkVT74280 (mm/s)
        - VentilnesttemperaturZweiteStufeDeckelseiteTETT73367 (°C)
        - VentilnesttemperaturZweiteStufeKurbelseiteTETT73386 (°C)
        - Wicklungstemperatur (°C)
        - ÖltemperaturVorlaufTriebwerkTETIT73538 (°C)
        - Biomethandurchfluss (m^3/min)
  - class_path: Dataflux.modules.normalize.NormalizeFit
    init_args:
      method: minmax
      remove_outliers: false
      exclude_keys:
        - ts
  - class_path: Dataflux.modules.normalize.NormalizeTransform
    init_args:
      custom:
      - EnddruckErsteStufePIT73339 (bar), 0, 50
      - EnddruckZweiteStufePIT73397 (bar), 0, 100
      - EndtemperaturErsteStufeTETIT73334 (°C), -20, 200
      - EndtemperaturZweiteStufeTETIT73371 (°C), -20, 200
      - EndtemperaturZweiteStufenachKühlerTETIT73378 (°C), -20, 200
      - DifferenzdruckTriebwerksölPDIT73553 (bar), 0, 8
      - KompressordrehzahlSE73201 (rpm), 0, 1000
      - KühlwasserdrucknachPumpePIT73425 (bar), -10, 100.0
      - KühlwasserdurchflussmengeFIT73423 (m^3/min), 0, 6
      - KühlwassertemperaturnachKühlerTETIT73422 (°C), -20.0, 200.0
      - Motorlager (°C), -55.0, 180.0
      - PackungsleckageFIT73389 (Nm3h), 0, 50.0
      - SaugdruckErsteStufePIT73319 (bar), 0, 50
      - SaugdruckZweiteStufePIT73340 (bar), 0, 50
      - SaugtemperaturErsteStufeTETIT73328 (°C), -20, 200.0
      - SaugtemperaturZweiteStufeTETIT73341 (°C), -20.0, 200.0
      - SchwingungsmessungTriebwerkVT74280 (mm/s), 0, 50.0
      - VentilnesttemperaturZweiteStufeDeckelseiteTETT73367 (°C), -20.0, 200.0
      - VentilnesttemperaturZweiteStufeKurbelseiteTETT73386 (°C), -20.0, 200.0
      - Wicklungstemperatur (°C), -55.0, 200.0
      - ÖltemperaturVorlaufTriebwerkTETIT73538 (°C), -20.0, 200.0
      - Biomethandurchfluss (m^3/min), 0, 1300
  - class_path: Dataflux.modules.split.SplitDataset
    init_args:
      name: thyssen-vd1-labeled-valset
      percentage: 0.3
      overwrite: false