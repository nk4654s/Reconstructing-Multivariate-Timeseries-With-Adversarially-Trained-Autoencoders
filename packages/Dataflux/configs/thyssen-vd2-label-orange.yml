folder: thyssen-vd2-labeled-testset
machine_uuid: 0b3426b3-94af-4b8c-89c1-da57493c099a
intervals:
  - 2023-04-01 2023-04-27 # Packungsleckage
  - 2023-07-01 2023-07-17 # Packungsleckage
  - 2024-08-29 2024-08-30 # Unknown
num_workers: 1
disk_backup: thyssen-vd2-orange
overwrite: true

modules:
  - class_path: Dataflux.modules.Rename
    init_args:
      enable: True
  - class_path: Dataflux.modules.State
    init_args:
      key: "Laeuft"
      lower: 0.9
      upper: 1.1
      alpha_threshold: 10800
      beta_threshold: 900
  - class_path: Dataflux.modules.State
    init_args:
      key: "PositionBypassregelventilPCV74381 (%)"
      lower: -0.999
      upper: 0.001
      alpha_threshold: 900
      beta_threshold: 900
  - class_path: Dataflux.modules.features.Features
    init_args:
      include:
        - SaugtemperaturZweiteStufeTETIT74341 (°C)
        - SaugdruckZweiteStufePIT74340 (bar)
        - SchwingungsmessungTriebwerkVT74280 (mm/s)
        - VentilnesttemperaturZweiteStufeKurbelseiteTETT74386 (°C)
        - KühlwassertemperaturnachKühlerTETIT74422 (°C)
        - EnddruckZweiteStufePIT74397 (bar)
        - KühlwasserdurchflussmengeFIT74423 (m^3/min)
        - KühlwasserdrucknachPumpePIT74425 (bar)
        - PackungsleckageFIT74389 (Nm3h)
        - SaugtemperaturErsteStufeTETIT74328 (°C)
        - EnddruckErsteStufePIT74339 (bar)
        - ÖltemperaturVorlaufTriebwerkTETIT74538 (°C)
        - Wicklungstemperatur (°C)
        - Motorlager (°C)
        - SaugdruckErsteStufePIT74319 (bar)
        - VentilnesttemperaturZweiteStufeDeckelseiteTETT74367 (°C)
        - EndtemperaturZweiteStufenachKühlerTETIT74378 (°C)
        - KompressordrehzahlSE74201 (rpm)
        - EndtemperaturZweiteStufeTETIT74371 (°C)
        - EndtemperaturErsteStufeTETIT74334 (°C)
        - DifferenzdruckTriebwerksölPDIT74553 (bar)
        - Biomethandurchfluss (m^3/min)
  - class_path: Dataflux.modules.normalize.NormalizeFit
    init_args:
      method: minmax
      remove_outliers: false
      exclude_keys:
        - ts
  - class_path: Dataflux.modules.normalize.NormalizeTransform
    init_args:
      from_other: thyssen-vd2-labeled-trainset