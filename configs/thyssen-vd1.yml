folder: thyssen-vd1-trainset
machine_uuid: a6252582-01dd-49cb-8dbe-0742b28bc007
intervals:
# - start      end
  - 2020-11-01 2024-10-30
num_workers: 4
disk_backup: dataset-vd1-backup
overwrite: true

modules:
  - class_path: Dataflux.modules.State
    init_args:
      key: "Laeuft"
      lower: 0.9
      upper: 1.1
      delete_ts: 1800
  - class_path: Dataflux.modules.state.State
    init_args:
      key: "Kompressordrehzahl"
      lower: 400
      upper: 980
      delete_ts: 1800
  - class_path: Dataflux.modules.state.State
    init_args:
      key: "VentilnesttemperaturZweiteStufeKurbelseite"
      lower: 100
      upper: 145
      delete_ts: 900
  - class_path: Dataflux.modules.state.State
    init_args:
      key: "VentilnesttemperaturZweiteStufeDeckelseite"
      lower: 100
      upper: 145
      delete_ts: 900
  - class_path: Dataflux.modules.state.State
    init_args:
      key: "EndtemperaturZweiteStufe"
      lower: 100
      upper: 148
      delete_ts: 900
  - class_path: Dataflux.modules.state.State
    init_args:
      key: "Wicklungstemperatur"
      lower: 50
      upper: 120
      delete_ts: 900
  - class_path: Dataflux.modules.state.State
    init_args:
      key: "Packungsleckage"
      lower: 0
      upper: 45
      delete_ts: 300
  - class_path: Dataflux.modules.state.State
    init_args:
      key: "SchwingungsmessungTriebwerk"
      lower: 0
      upper: 3
      delete_ts: 300
  - class_path: Dataflux.modules.remove.Remove
    init_args:
      columns:
        - Automatenfall/SpannungGestört
        - Betriebsstunden
        - Biomethandurchfluss
        - Differenzdruck
        - Laeuft
        - Motor ( # remove with units A or kW but keep 'Motorlager'
        - Nachlauf
        - NiveauschalterTriebwerksöl
        - Nothalt
        - Positio # Typo in sensor names
        - Sammelwarnung
        - Startbereit
        - StörungGekommen
        - Verdichter
        - Vorlauf
        - VD1
  - class_path: Dataflux.modules.normalize.NormalizeFit
    init_args:
      method: minmax
      remove_outliers: false
      exclude_keys:
        - ts
  - class_path: Dataflux.modules.normalize.NormalizeTransform
  - class_path: Dataflux.modules.split.SplitDataset
    init_args:
      name: thyssen-vd1-valset
      percentage: 0.3
      overwrite: true