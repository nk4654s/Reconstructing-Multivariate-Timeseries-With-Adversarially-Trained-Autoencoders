seed_everything: true
trainer:
  callbacks: 
    # define the early stopping callback
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: validate/MSELoss
        min_delta: 0.0001
        patience: 5
  # define training configuration
  precision: 32
  max_epochs: 1
  gradient_clip_val: 1.0
#  profiler: "simple"
  log_every_n_steps: 1
# configure model hyper-parameter
model:
  class_path: Comprisk.model.ae.AutoEncoder
  init_args:
    # gerneral parameters
    activation: tanh
    loss: MSELoss
    optimizer: Adam
    lr: 0.00015
    # encoder/decoder
    encoder:
      class_path: Comprisk.model.ae.rnn.LSTMEncoderBypass
      init_args:
        num_features: 26
        num_latent_dim: 26
        num_hidden_dim: 32
        num_hidden_layers: 1
        dropout_prob: 0.2
    decoder:
      class_path: Comprisk.model.ae.rnn.LSTMDecoderBypass
      init_args:
        num_features: 26
        num_latent_dim: 27
        num_hidden_dim: 32
        num_hidden_layers: 1
        dropout_prob: 0.2
data:
  # configure dataset to load
  path: /Users/jonas/Dataset/dataset-2021-23
  input_sequence: 100
  output_sequence: 100
  skip: 2
  # configure how to sample from the dataset
  batch_size: 128
  shuffle: true
  train_size: 0.01
  validation_size: 0.01
  # configure the workers sampling the dataset
  num_workers: 4