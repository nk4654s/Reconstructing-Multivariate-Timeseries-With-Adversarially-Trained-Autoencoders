model:
  encoder:
    num_latent_dim:
      type: int
      min: 1
      max: 20

    num_hidden_dim:
      type: int
      min: 32
      max: 128
    
    num_hidden_layers:
      type: int
      min: 2
      max: 3

data:
  input_sequence:
    type: int
    min: 100
    max: 500

  skip:
    type: int
    min: 5
    max: 20

rules:
  - decoder.num_latent_dim: encoder.num_latent_dim
  - decoder.num_hidden_dim: encoder.num_hidden_dim
  - decoder.num_hidden_layers: encoder.num_hidden_layers
