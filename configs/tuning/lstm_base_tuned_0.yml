data:
  batch_size: 256
  input_sequence: 500
  num_workers: 4
  output_sequence: 0
  train: /Users/jonas/Dataset/labeled/dataset-cat-green
  validate: /Users/jonas/Dataset/labeled/dataset-cat-gray
  shuffle: true
  skip: 5
model:
  class_path: Comprisk.model.ae.AutoEncoder
  init_args:
    activation: tanh
    decoder:
      class_path: Comprisk.model.ae.rnn.LSTMDecoder
      init_args:
        dropout_prob: 0.3
        num_features: 20
        num_hidden_dim: 128
        num_hidden_layers: 2
        num_latent_dim: 20
        predict_key: sensors
    encoder:
      class_path: Comprisk.model.ae.rnn.LSTMEncoderBypass
      init_args:
        dropout_prob: 0.3
        num_features: 20
        num_hidden_dim: 128
        num_hidden_layers: 2
        num_latent_dim: 20
    loss: MSELoss
    lr: 0.00015
    optimizer: Adam
seed_everything: true
trainer:
  callbacks:
  - class_path: lightning.pytorch.callbacks.EarlyStopping
    init_args:
      min_delta: 0.0001
      monitor: validate/MSELoss
      patience: 2
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      auto_insert_metric_name: false
      dirpath: checkpoints
      every_n_epochs: 1
      filename: epoch={epoch}-val={validate/MSELoss:.6f}
      mode: min
      monitor: validate/MSELoss
      save_top_k: 3
  gradient_clip_val: 1.0
  log_every_n_steps: 1
  max_epochs: 5
  precision: 32
