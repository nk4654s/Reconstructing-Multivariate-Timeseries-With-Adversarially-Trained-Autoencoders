# 0. define the dataset to use
dataset:
 - config: configs/vd2-version-2/dataset-1.yml
 - config: configs/vd2-version-2/dataset-2.yml
 - config: configs/vd2-version-2/testset-before-service.yml
 - config: configs/vd2-version-2/testset-after-service.yml
 - config: configs/vd2-version-2/testset-coolant-anomaly.yml

# 1. tune the model given a search space for the hyperparameters
# tuner:
#   config: configs/vd2-version-2/lstm_base.yml
#   tuner_config: configs/vd2-version-2/tune_search_space.yml
#   tuner_trials: 20

# 2. train the model using the tuned hyperparameters
trainer:
  # train on the first maintenance interval 
  - config: configs/vd2-version-2/training_phase_I_initial.yml
    tag: vd2-I-interval-training-2
    stride: 10
  - config: configs/vd2-version-2/training_phase_I_intermediate.yml
    tag: vd2-I-interval-training-2
    stride: 5
  - config: configs/vd2-version-2/training_phase_I_final.yml
    tag: vd2-I-interval-training-2
    stride: 1
  # update the model on the second maintenance interval 
  - config: configs/vd2-version-2/training_phase_II_update.yml
    tag: vd2-I-interval-training-2
    stride: 10
  - config: configs/vd2-version-2/training_phase_II_update.yml
    tag: vd2-I-interval-training-2
    stride: 1

# 3. generate some analysis data to review the model
analyzer:
  - dataset: /Users/jonas/Dev/NEAX/Comprisk/thyssen-vd2-after-service
    prefix: analysis/after-service
  - dataset: /Users/jonas/Dev/NEAX/Comprisk/thyssen-vd2-before-service
    prefix: analysis/before-service
  - dataset: /Users/jonas/Dev/NEAX/Comprisk/thyssen-vd2-coolant-anomaly
    prefix: analysis/coolant

# 4. upload everything
generate:
  dataset: configs/vd2-version-2/dataset-upload.yml
  stride: 60
