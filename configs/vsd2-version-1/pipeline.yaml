# 0. define the dataset to use
dataset:
 - config: configs/fullhistory/dataset.yml
 - config: configs/fullhistory/testset-bad-sequence.yml
 - config: configs/fullhistory/testset-after-service.yml
#  - config: configs/fullhistory/testset-june.yml

# 1. tune the model given a search space for the hyperparameters
# tuner:
#   config: configs/fullhistory/lstm_base.yml
#   tuner_config: configs/fullhistory/tune_search_space.yml
#   tuner_trials: 20

# 2. train the model using the tuned hyperparameters
trainer:
  - config: configs/fullhistory/initial_training.yml
    tag: cleaned-outliers-smallest
  - config: configs/fullhistory/final_training.yml
    tag: cleaned-outliers-smallest

analyzer:
# 1. generate data on the test dataset
  - dataset: /Users/jonas/Dev/NEAX/Comprisk/dataset-test-after-service
    prefix: analysis/good
# 2. generate data on the test dataset
  - dataset: /Users/jonas/Dev/NEAX/Comprisk/dataset-test-suspicious
    prefix: analysis/bad
# 3. generate data on the trajn dataset
  - dataset: /Users/jonas/Dev/NEAX/Comprisk/dataset-clean-train
    prefix: analysis/train
# 4. generate data on the train dataset
  - dataset: /Users/jonas/Dev/NEAX/Comprisk/dataset-clean-validate
    prefix: analysis/validate
#
# do not use score transformer
#
# 1. generate data on the test dataset
  - dataset: /Users/jonas/Dev/NEAX/Comprisk/dataset-test-after-service
    prefix: analysis/good
    static_scores: true
# 2. generate data on the test dataset
  - dataset: /Users/jonas/Dev/NEAX/Comprisk/dataset-test-suspicious
    prefix: analysis/bad
    static_scores: true
# 3. generate data on the trajn dataset
  - dataset: /Users/jonas/Dev/NEAX/Comprisk/dataset-clean-train
    prefix: analysis/train
    static_scores: true
# 4. generate data on the train dataset
  - dataset: /Users/jonas/Dev/NEAX/Comprisk/dataset-clean-validate
    prefix: analysis/validate
    static_scores: true
