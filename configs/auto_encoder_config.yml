seed_everything: true
trainer:
  callbacks: 
    # define the early stopping callback
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: validate/MSELoss
        min_delta: 0.0001
        patience: 5
  # define training configuration
  precision: 32
  max_epochs: 50
  gradient_clip_val: 1.0
  profiler: "simple"
  log_every_n_steps: 5
# configure model hyper-parameter
model:
  class_path: Comprisk.model.ae.AutoEncoder
  init_args:
    # encoder/decoder parameters
    num_filters: 64
    dropout_prob: 0.2
    kernel_size: 5
    # gerneral parameters
    weather_bypass: False
    base:
      # tanh for standardized dataset, sigmoid for normalized dataset
      activation: tanh
      loss: MSELoss
      optimizer: Adam
      lr: 0.001
data:
  # configure dataset to load
  data_kwargs:
    path: ../Dataflux/dataset-2021-22
    input_sequence: 1_000
    output_sequence: 1_000
    skip: 2
  # configure how to sample from the dataset
  sampler_kwargs:
    batch_size: 32
    shuffle: True
    train_size: 0.7
    validation_size: 0.2
  # configure the workers sampling the dataset
  loader_kwargs:
    num_workers: 2
    persistent_workers: True
    pin_memory: true