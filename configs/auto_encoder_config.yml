seed_everything: true
trainer:
  callbacks: 
    # define the early stopping callback
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: validate/MSELoss
        min_delta: 0.0001
        patience: 5
  # define training configuration
  precision: 32
  max_epochs: 1
  gradient_clip_val: 1.0
  profiler: "simple"
  log_every_n_steps: 1
# configure model hyper-parameter
model:
  class_path: Comprisk.model.ae.cnn.AutoEncoder
  init_args:
    # complete or sequence
    mode: complete
    # encoder/decoder parameters
    kernel_size: 200
    num_filters: 32
    stride: 20
    dropout_prob: 0.2
    weather_bypass: false
    # gerneral parameters
    base:
      activation: sigmoid
      loss: MSELoss
      optimizer: Adam
      lr: 0.001
data:
  # configure dataset to load
  path: ../Dataflux/dataset-2021-22
  input_sequence: 1_000
  output_sequence: 1_000
  skip: 2
  # configure how to sample from the dataset
  batch_size: 512
  shuffle: true
  train_size: 0.5
  validation_size: 0.3
  # configure the workers sampling the dataset
  num_workers: 4
  persistent_workers: true
  pin_memory: true