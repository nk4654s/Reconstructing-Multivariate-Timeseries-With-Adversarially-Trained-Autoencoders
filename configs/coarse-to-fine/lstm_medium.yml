seed_everything: true
trainer:
  callbacks: 
    # define the early stopping callback
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: validate/MSELoss
        min_delta: 0.0001
        patience: 2
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        every_n_epochs: 1
        monitor: validate/MSELoss
        filename: "epoch={epoch}-val={validate/MSELoss:.6f}"
        auto_insert_metric_name: false
        save_top_k: 3
        mode: min
        dirpath: checkpoints
        
  # define training configuration
  precision: 32
  max_epochs: 2
  gradient_clip_val: 1.0
#  profiler: "simple"
  log_every_n_steps: 1
# configure model hyper-parameter
model:
  class_path: Comprisk.model.ae.AutoEncoder
  init_args:
    # gerneral parameters
    activation: tanh
    loss: MSELoss
    optimizer: Adam
    lr: 0.00015
    # encoder/decoder
    encoder:
      class_path: Comprisk.model.ae.rnn.LSTMEncoderBypass
      init_args:
        num_features: 20
        num_latent_dim: 10
        num_hidden_dim: 32
        num_hidden_layers: 2
        dropout_prob: 0.3
    decoder:
      class_path: Comprisk.model.ae.rnn.LSTMDecoder
      init_args:
        num_features: 20
        num_latent_dim: 10
        num_hidden_dim: 32
        num_hidden_layers: 2
        dropout_prob: 0.3
        predict_key: sensors
data:
  # configure dataset to load
  path: /Users/jonas/Dataset/labeled/dataset-cat-green
  input_sequence: 200
  output_sequence: 0
  skip: 20
  # configure how to sample from the dataset
  batch_size: 256
  shuffle: true
  train_size: 0.7
  validation_size: 0.2
  # configure the workers sampling the dataset
  num_workers: 4