# configure parameters for the Tuner
tuner_args:
  train_size_percentage: 1
  val_size_percentage: 0.2

# configure hyper parameter search spaces
stride:
  type: int
  min: 2
  max: 12

num_filters:
  type: int
  min: 80
  max: 120

kernel_size:
  type: int
  min: 64
  max: 128

bypass_hidden_size:
  type: int
  min: 786
  max: 2048